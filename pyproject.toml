[project]
name = "fairness-credit-scoring-replication"
version = "0.1.0"
description = "A partial replication of Fairness in Credit Scoring"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2.3,<4",
    "scikit-learn>=1.6,<2",
    "threadpoolctl>=3.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fair_credit_scoring"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
